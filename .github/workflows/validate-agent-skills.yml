name: Validate Agent Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate_agent_skills.py"
      - ".github/workflows/validate-agent-skills.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/validate_agent_skills.py"
      - ".github/workflows/validate-agent-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical skill bundles
        run: python scripts/validate_agent_skills.py .
