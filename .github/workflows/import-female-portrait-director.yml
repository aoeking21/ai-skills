name: Import female-portrait-director

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-female-portrait-director.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ai-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          rm -rf /tmp/female-portrait-director
          git clone --depth 1 https://github.com/aoeking21/female-portrait-director.git /tmp/female-portrait-director

      - name: Import complete project
        run: |
          mkdir -p image-generation/female-portrait-director
          rsync -a --delete --exclude='.git' /tmp/female-portrait-director/ image-generation/female-portrait-director/

      - name: Build library structure and index
        run: |
          mkdir -p prompt-engineering docs
          cat > README.md <<'EOF'
          # AI Skills Library

          张霆的个人 AI Skills 总库，用于集中管理图像生成、提示词工程与 Agent 工作流。

          ## 图像生成

          ### female-portrait-director

          女性人像提示词导演 Skill：锁定用户明确参数，通过单一路由组织人物、动作、服装、场景、镜头、光线与滤镜，生成完整、可复制的摄影导演式提示词；支持已授权成年人物或产品参考主体的保留工作流。

          - [进入模块](image-generation/female-portrait-director/README_zh.md)
          - [Skill 入口](image-generation/female-portrait-director/SKILL.md)
          - [独立仓库](https://github.com/aoeking21/female-portrait-director)
          - 上游来源：[liyue-aigc/female-portrait-director](https://github.com/liyue-aigc/female-portrait-director)

          ## 目录结构

          ```text
          ai-skills/
          ├── image-generation/
          │   └── female-portrait-director/
          ├── prompt-engineering/
          └── docs/
          ```

          ## 许可与署名

          `female-portrait-director` 保留原项目作者、许可证、免责声明和版本信息。该模块使用 MIT License。
          EOF

          cat > prompt-engineering/README.md <<'EOF'
          # Prompt Engineering

          提示词工程、参数 Schema、人物身份锁定和摄影工作流将在此分类管理。
          EOF

          cat > docs/README.md <<'EOF'
          # Documentation

          本目录用于存放 AI Skills 总库的使用说明、维护规范与索引文档。
          EOF

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md image-generation prompt-engineering docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import complete female-portrait-director skill"
          git push origin main
