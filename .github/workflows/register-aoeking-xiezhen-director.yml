name: Register aoeking xiezhen director

on:
  push:
    branches:
      - agent/register-aoeking-xiezhen-director
    paths:
      - .github/workflows/register-aoeking-xiezhen-director.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/register-aoeking-xiezhen-director
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build standalone Agent Skill
        shell: bash
        run: |
          set -euo pipefail

          skill_root="skills/aoeking-xiezhen-director"
          source_root="image-generation/nuyoah-xiezhen-prompt"
          rm -rf "$skill_root"
          mkdir -p "$skill_root/references" "$skill_root/agents" "$skill_root/evals"

          cp "$source_root/aoeking-enhanced/references/person-identity-dna.md" \
            "$skill_root/references/person-identity-dna.md"
          cp "$source_root/aoeking-enhanced/references/photographic-event-schema.md" \
            "$skill_root/references/photographic-event-schema.md"
          cp "$source_root/aoeking-enhanced/references/failure-diagnosis.md" \
            "$skill_root/references/failure-diagnosis.md"
          cp "$source_root/upstream/references/prompt-logic.md" \
            "$skill_root/references/upstream-prompt-logic.md"
          cp "$source_root/upstream/LICENSE" "$skill_root/THIRD_PARTY_LICENSE"

          cat > "$skill_root/SKILL.md" <<'EOF'
          ---
          name: aoeking-xiezhen-director
          description: 为已明确成年的授权人物生成、改写、扩展或诊断中文 AI 写真与人像摄影提示词。适用于人物身份 DNA 锁定、真实年龄与身体比例连续性、系列母版、同系列独立变体、真实街头或旅行抓拍、摄影事件设计，以及修复身份漂移、模板脸、摆拍感、身体曲线漂移、皮肤油膜、衣料受力或环境物理错误。也适用于 GPT Image、image-2、gpt-image-2 等图像模型的人像提示词。默认交付可复制提示词；用户明确要求直接生图且宿主提供图像工具时，可在同一任务中调用图像工具。
          license: MIT
          metadata:
            author: "aoeking21"
            version: "1.1.0"
            source: "https://github.com/aoeking21/ai-skills/tree/main/skills/aoeking-xiezhen-director"
            derived_from: "nuyoah-ai-works/nuyoah-xiezhen-prompt@bc1edb21655e36b89599d31b16f23ad5193d483f"
          ---

          # aoeking-xiezhen-director

          ## 目标

          把长期真人写真项目稳定拆成三层：人物真值、摄影事件、成像表达。场景、服装、动作、镜头、妆容和风格都属于可变层，不能覆盖人物真值层。

          ## 使用边界

          - 只处理明确为成年人的人物。
          - 人物参考图必须由用户提供，或用户确认有权使用。
          - 没有参考图时，不宣称能够锁定某个具体真人身份。
          - 不把真实人物改造成明星脸、网红模板脸、幼态脸或标准化审美脸。
          - 默认输出提示词。用户明确要求直接生成图片且宿主提供图像工具时，先完成本 Skill 的提示词编译，再调用图像工具。
          - 宿主没有图像工具时，直接交付提示词并简要说明能力边界。

          ## 输入优先级

          1. 用户本轮明确要求。
          2. 用户上传的授权成年人物参考图。
          3. 用户已确认的人物 DNA、体态、眼镜、发型、纹身和连续项目规则。
          4. 本 Skill 的固定方法。
          5. 通用摄影审美。

          下层规则与上层冲突时，执行上层规则。

          ## 路由

          - 用户要求“完整提示词、直接生图、精准控制、复刻”时，输出单张详细提示词。
          - 用户要求“系列母版、长期项目、固定格式”时，输出稳定母版、固定项和变量槽位。
          - 用户要求“同系列变体、不同姿势、五张独立图片”时，为每张建立独立摄影事件和独立提示词。
          - 用户说“失败、漂移、摆拍、废片、重试、判断有误”时，先诊断最上游失败层，再给最小整改版。
          - 用户给图要求拆解时，只提取可见事实；不确定内容标为“疑似”。
          - 用户要求短词、抽卡或网页大量生成时，输出 6 至 8 行紧凑关键词。

          ## 强制执行顺序

          1. 读取人物身份 DNA。
          2. 锁定真实年龄、骨架、肩颈、四肢、胸廓、腰臀关系和自然不对称。
          3. 确定单一主摄影事件。
          4. 由事件推导身体重心、手部反应、视线和表情。
          5. 推导衣料、头发、风、水、汗、重力和环境接触关系。
          6. 设计构图、机位、焦段、快门、景深和光线。
          7. 控制皮肤微纹理与区域反射。
          8. 加入少量高信号负面约束。
          9. 检查身份、体态、事件、物理和摄影语言是否互相冲突。

          ## 人物真值层

          必须读取并执行 [人物身份 DNA](references/person-identity-dna.md)。身份与身体结构的优先级高于服装、场景、姿态、妆容和风格。

          参考图只允许目标系列接管可变摄影元素。脸型、五官比例、年龄、肤色、骨架、肩颈比例、四肢长度、体态和自然不对称继续来自人物真值。

          ## 摄影事件层

          必须读取并执行 [真实摄影事件 Schema](references/photographic-event-schema.md)。每张图只保留一个主事件。动作、视线和表情必须是事件的结果，不能先写姿势再寻找理由。

          多张生成时，每张都要改变事件因果链、动作阶段、重心、构图或现场条件。不得仅替换动作词，也不得输出拼图或五宫格，除非用户明确要求拼图。

          ## 摄影与提示词逻辑

          妆容、道具、构图、镜头、成像机制、现场光线、皮肤纹理和区域反射读取 [上游摄影提示词逻辑](references/upstream-prompt-logic.md)。

          本 Skill 对上游规则的覆盖项：

          - 真实参考人物不得被默认年轻化。
          - 身体轮廓来自参考图或用户明确参数，不自动套用通用模特曲线。
          - 目标系列只能接管可变摄影元素，不能接管人物身份。
          - 同系列变体不能复制同一动作、灯位、视线或镜头交流。
          - 汗光、湿发、衣料贴合和水花都必须有现场事件依据。

          ## 失败诊断

          用户反馈出片失败时，读取 [失败成片诊断](references/failure-diagnosis.md)。一次优先修复一个最上游错误：

          1. 身份漂移。
          2. 年龄或身体结构漂移。
          3. 摄影事件失效。
          4. 动作与物理失真。
          5. 摄影与光线问题。
          6. 局部质感问题。

          不用堆叠更多空泛形容词掩盖结构性错误。

          ## 输出契约

          ### 单张详细提示词

          按以下顺序组织：人物身份与授权范围、人物真值、摄影事件、动作与表情、服装与衣料物理、场景与环境物理、构图与镜头、光线与曝光、皮肤纹理与区域反射、负面约束、画幅与输出规格。

          ### 系列母版

          明确分为固定层、变量槽位、事件池、禁止项和单张编译规则。固定层只能包含身份真值与系列成像机制。

          ### 独立变体

          每张输出独立编号和完整提示词。每张只出现同一人物一次，除非用户要求多人或重复人物效果。

          ### 直接生图

          用户明确要求直接生图且宿主提供图像工具时：

          1. 内部完成提示词编译。
          2. 对每张图片分别调用一次图像工具。
          3. 不把多张请求压成一张拼图。
          4. 无法连续调用多次时，如实说明实际生成数量。

          ## 最终检查

          交付前确认：

          - 人物是否仍能被识别为参考图中的同一位成年人。
          - 年龄、眼镜、发型、纹身和身体结构是否符合用户规则。
          - 画面是否存在明确且单一的摄影事件。
          - 动作、表情、衣料、风、水、汗和重力是否具有因果关系。
          - 光线是否写清来源、方向、人物落点与成像结果。
          - 皮肤是否同时保留微纹理，并按区域控制反射。
          - 多张变体是否真正独立，且没有拼图化。
          EOF

          # Remove heredoc indentation introduced by YAML block.
